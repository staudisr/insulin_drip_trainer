name: Deploy Single File to Public Repo

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Source Code
        uses: actions/checkout@v4

      - name: Configure Git Credentials
        run: |
          git config --global user.name "staudisr"
          git config --global user.email "staudisr@gmail.com"

      - name: Push to Public Hosting Repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: '.'
          destination-github-username: 'staudisr'
          destination-repository-name: 'insulin_drip_grid_practice'
          user-email: 'staudisr@gmail.com'
          user-name: 'staudisr'
          commit-message: 'Automated deployment from private source'
          target-branch: 'main'
